    <script>
      (() => {
        const THEME_STORAGE_KEY = "intear-dex-theme";
        const THEME_COLORS = {
          dark: "#0a0e17",
          light: "#f4f7fb",
        };

        const isThemePreference = (value) =>
          value === "light" || value === "dark" || value === "system";

        let storedPreference = null;
        try {
          storedPreference = localStorage.getItem(THEME_STORAGE_KEY);
        } catch {}

        const preference = isThemePreference(storedPreference)
          ? storedPreference
          : "system";
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
          .matches
          ? "dark"
          : "light";
        const resolvedTheme =
          preference === "system" ? systemTheme : preference;

        const root = document.documentElement;
        root.dataset.theme = resolvedTheme;
        root.style.colorScheme = resolvedTheme;

        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", THEME_COLORS[resolvedTheme]);
      })();
    </script>

    <link
      rel="preload"
      href="https://wallet.intear.tech/near-selector.js"
      as="script"
    />
    <script>
      (() => {
        const BASE_URL = "https://app.chatwoot.com";
        const WEBSITE_TOKEN = "rWhhtHuth6NLdgiiePdWqerD";
        const SDK_SCRIPT_ID = "chatwoot-sdk-script";
        const SUPPORT_BUTTON_ID = "support-chat-button";
        const SUPPORT_BUTTON_LOADING_CLASS = "support-chat-button--loading";

        let sdkLoadPromise = null;
        let sdkReadyPromise = null;
        let sdkInitialized = false;

        window.chatwootSettings = {
          position: "right",
          type: "standard",
          launcherTitle: "Chat with us",
          hideMessageBubble: true,
        };

        const loadChatwootSdk = () => {
          if (window.chatwootSDK) {
            return Promise.resolve();
          }

          if (sdkLoadPromise) {
            return sdkLoadPromise;
          }

          sdkLoadPromise = new Promise((resolve, reject) => {
            const existingScript = document.getElementById(SDK_SCRIPT_ID);
            if (existingScript) {
              existingScript.addEventListener("load", resolve, { once: true });
              existingScript.addEventListener(
                "error",
                () => {
                  reject(new Error("Failed to load Chatwoot SDK"));
                },
                { once: true },
              );
              return;
            }

            const script = document.createElement("script");
            script.id = SDK_SCRIPT_ID;
            script.src = `${BASE_URL}/packs/js/sdk.js`;
            script.async = true;
            script.addEventListener("load", resolve, { once: true });
            script.addEventListener(
              "error",
              () => {
                reject(new Error("Failed to load Chatwoot SDK"));
              },
              { once: true },
            );
            document.head.appendChild(script);
          });

          return sdkLoadPromise;
        };

        const waitForChatwootReady = () => {
          if (window.$chatwoot?.hasLoaded) {
            return Promise.resolve();
          }

          if (sdkReadyPromise) {
            return sdkReadyPromise;
          }

          sdkReadyPromise = new Promise((resolve) => {
            window.addEventListener("chatwoot:ready", resolve, { once: true });
          });

          return sdkReadyPromise;
        };

        const initializeChatwoot = () => {
          if (sdkInitialized) {
            return waitForChatwootReady();
          }

          window.chatwootSDK.run({
            websiteToken: WEBSITE_TOKEN,
            baseUrl: BASE_URL,
          });
          sdkInitialized = true;

          return waitForChatwootReady();
        };

        const openSupportChat = async () => {
          const supportButton = document.getElementById(SUPPORT_BUTTON_ID);
          if (!(supportButton instanceof HTMLButtonElement)) {
            return;
          }

          supportButton.disabled = true;
          supportButton.classList.add(SUPPORT_BUTTON_LOADING_CLASS);

          try {
            await loadChatwootSdk();
            await initializeChatwoot();
            window.$chatwoot?.toggle?.("open");
          } catch (error) {
            console.error(error);
          } finally {
            supportButton.disabled = false;
            supportButton.classList.remove(SUPPORT_BUTTON_LOADING_CLASS);
          }
        };

        const bindSupportButtonClick = () => {
          const supportButton = document.getElementById(SUPPORT_BUTTON_ID);
          if (!(supportButton instanceof HTMLButtonElement)) {
            return;
          }

          supportButton.addEventListener("click", openSupportChat);
        };

        if (document.readyState === "loading") {
          document.addEventListener(
            "DOMContentLoaded",
            bindSupportButtonClick,
            {
              once: true,
            },
          );
        } else {
          bindSupportButtonClick();
        }
      })();
    </script>
